services:
  - type: web
    name: pulse-linkedin
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        # Neon Postgres connection string — set in the Render dashboard (Environment tab)
        sync: false
      - key: NODE_ENV
        value: production
      - key: BRIDGE_URL
        # Point this at your deployed claude-web-bridge instance
        value: http://127.0.0.1:3000
      - key: BRIDGE_PROVIDER
        value: claude
      # Set BRIDGE_API_KEY in the Render dashboard (Environment tab) if the bridge requires auth
