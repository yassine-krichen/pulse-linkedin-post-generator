services:
  - type: web
    name: pulse-linkedin
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        # Free tier: ephemeral (resets on redeploy). Upgrade to paid + add disk below.
        value: file:./dev.db
      - key: NODE_ENV
        value: production
      - key: BRIDGE_URL
        # Point this at your deployed claude-web-bridge instance
        value: http://127.0.0.1:3000
      - key: BRIDGE_PROVIDER
        value: claude
      # Set BRIDGE_API_KEY in the Render dashboard (Environment tab) if the bridge requires auth

# ── Persistent disk (paid tier only, ~$1/month) ───────────────────────────────
# Uncomment to persist SQLite across restarts and redeploys.
# Also change DATABASE_URL above to: file:/var/data/prod.db
#
#    disk:
#      name: pulse-db
#      mountPath: /var/data
#      sizeGB: 1
